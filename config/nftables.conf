#!/usr/sbin/nft -f
# /etc/nftables.conf - pare-feu du serveur (exigence J2, projet XTI302).
# Charge au demarrage par le service nftables : la regle survit a un redemarrage.
#
# On ne fait PAS "flush ruleset" : cela effacerait aussi la table de fail2ban
# (J1) a chaque rechargement. On ne remplace que NOTRE table "filtre".
add table inet filtre
delete table inet filtre

table inet filtre {
    chain entree {
        # Politique par defaut : tout ce qui entre est refuse.
        type filter hook input priority filter; policy drop;

        # Reponses aux connexions deja etablies (ex. : apt-get update, DNS).
        ct state established,related accept
        ct state invalid drop

        # Boucle locale : trafic de la machine vers elle-meme (jamais du reseau).
        iif "lo" accept

        # SSH, seul service joignable depuis le reseau (S1 a S5, D2).
        tcp dport 22 ct state new accept
    }

    chain transit {
        # Le serveur n'est pas un routeur : rien ne le traverse.
        type filter hook forward priority filter; policy drop;
    }

    chain sortie {
        # Le serveur peut initier des connexions (mises a jour, DNS).
        type filter hook output priority filter; policy accept;
    }
}
