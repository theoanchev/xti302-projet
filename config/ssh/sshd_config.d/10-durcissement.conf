# /etc/ssh/sshd_config.d/10-durcissement.conf
# Durcissement du serveur SSH - exigences S1 a S5 (projet XTI302, contexte C).
# Copie par installer.sh, valide par "sshd -t" avant rechargement (S5).
# Rappel : sshd garde la PREMIERE valeur lue. Ce fichier est inclus en tete de
# /etc/ssh/sshd_config (ligne Include), le prefixe 10- le fait passer en premier.

# --- S1 : authentification par cle uniquement ---------------------------------
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
# Seule la methode "publickey" est acceptee, meme si une autre etait reactivee.
AuthenticationMethods publickey

# --- S2 : connexion de root interdite ------------------------------------------
PermitRootLogin no

# --- S3 : seuls les membres du groupe acces_ssh ---------------------------------
AllowGroups acces_ssh

# --- S4 : essais et inactivite --------------------------------------------------
# 3 essais par connexion (exigence : 4 au plus). Avec fail2ban (J1), un attaquant
# est banni apres quelques connexions ratees.
MaxAuthTries 3
# 30 s pour s'authentifier, sinon la connexion est coupee.
LoginGraceTime 30
# Session inactive fermee : 10 min sans activite sur le canal de session
# (exigence : 15 min au plus).
ChannelTimeout session=10m
# Connexion morte (client disparu) detectee en 2 x 300 s = 10 min.
ClientAliveInterval 300
ClientAliveCountMax 2

# --- Reduction de la surface d'attaque (bonus, justifie dans le dossier) --------
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
# Journalise l'empreinte de la cle utilisee : utile pour analyse_logs.sh (J4).
LogLevel VERBOSE

# --- Contexte C : les invites n'ont que le SFTP ---------------------------------
# internal-sftp est execute par sshd lui-meme : le shell nologin des invites
# n'est jamais lance, ils peuvent seulement transferer des fichiers.
Match Group invite
    ForceCommand internal-sftp
    PermitTTY no
    AllowTcpForwarding no
    X11Forwarding no
